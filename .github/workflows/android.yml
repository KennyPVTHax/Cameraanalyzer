name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run checks and build APKs
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --no-daemon
      - name: Name and verify APKs
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/CameraAnalyzer-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk delivery/CameraAnalyzer-release-unsigned.apk
          for apk in delivery/*.apk; do
            aapt dump badging "$apk" | head -1
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: CameraAnalyzer-APKs
          path: delivery/*.apk
          if-no-files-found: error
